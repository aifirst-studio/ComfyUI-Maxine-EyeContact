name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python install_client.py --skip-iris-color
      - name: Linux protocol and guard tests
        if: runner.os != 'Windows'
        run: runtime/bin/python -m unittest discover -s tests -v
      - name: Windows protocol and guard tests
        if: runner.os == 'Windows'
        run: runtime/Scripts/python.exe -m unittest discover -s tests -v
      - run: node tests/test_ui.mjs
  iris:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python install_client.py
      - if: runner.os != 'Windows'
        run: runtime/bin/python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        run: runtime/Scripts/python.exe -m unittest discover -s tests -v
