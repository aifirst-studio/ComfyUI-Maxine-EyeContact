[project]
name = "maxine-eye-contact"
version = "0.2.0"
description = "Local NVIDIA Maxine Eye Contact for ComfyUI VIDEO with progress and experimental iris-colour preservation. Requires a separately configured NVIDIA NIM service."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["imageio-ffmpeg==0.6.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/aifirst-studio/ComfyUI-Maxine-EyeContact"
Documentation = "https://github.com/aifirst-studio/ComfyUI-Maxine-EyeContact#readme"
"Bug Tracker" = "https://github.com/aifirst-studio/ComfyUI-Maxine-EyeContact/issues"

[tool.comfy]
PublisherId = "aifirst-studio"
DisplayName = "Maxine Eye Contact (Local)"
requires-comfyui = ">=0.37.0"
